<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f1e">
<title>Crossover Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Tahoma, sans-serif;
  background: linear-gradient(160deg, #0f0f1e, #1a1a2e, #16213e);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 40px;
}
.container { max-width: 480px; margin: 0 auto; }
h1 { text-align: center; font-size: 1.4rem; color: #00d9ff; margin-bottom: 6px; }
.subtitle { text-align: center; font-size: 0.8rem; color: #8888aa; margin-bottom: 16px; }
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}
label { display: block; font-size: 0.85rem; color: #a0a0c0; margin: 12px 0 6px; }
input, select {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #0a0a1a;
  color: #fff;
  font-size: 1rem;
  text-align: center;
  direction: ltr;
  font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: #00d9ff; }
select { cursor: pointer; }
.btn-group { display: flex; gap: 6px; margin-bottom: 10px; }
.btn-group button, .order-group button {
  flex: 1;
  padding: 12px 6px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #1a1a2e;
  color: #aaa;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
}
.btn-group button.active, .order-group button.active {
  background: #00d9ff;
  color: #fff;
  border-color: #00d9ff;
  font-weight: bold;
}
.order-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.order-group button { font-size: 0.9rem; padding: 10px 4px; }
.badge {
  display: inline-block;
  background: linear-gradient(135deg, #7b61ff, #ff6496);
  color: #fff;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: bold;
  margin-right: 6px;
}
.action-row { display: flex; gap: 8px; margin-top: 16px; }
.action-row button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
}
.calc-btn { background: linear-gradient(135deg, #00d9ff, #0080ff); color: #fff; }
.reset-btn { background: #2a2a3e; color: #aaa; }
.coil-btn { background: linear-gradient(135deg, #ff6496, #7b61ff); color: #fff; }
.box-btn { background: linear-gradient(135deg, #00ff88, #00d9ff); color: #fff; }
.tone-btn { background: linear-gradient(135deg, #ffcc00, #ff6496); color: #fff; }
.result-box {
  background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(123,97,255,0.08));
  border: 1px solid rgba(0,217,255,0.3);
  border-radius: 16px;
  padding: 16px;
  margin-top: 16px;
}
.slope-box {
  background: linear-gradient(135deg, rgba(123,97,255,0.15), rgba(255,100,150,0.1));
  border: 1px solid rgba(123,97,255,0.4);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  text-align: center;
}
.slope-val {
  font-size: 1.8rem;
  font-weight: bold;
  color: #ff6496;
  direction: ltr;
  margin: 6px 0;
}
.slope-lbl { font-size: 0.8rem; color: #aaa; }
.item {
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.item:last-child { border-bottom: none; }
.item-row { display: flex; justify-content: space-between; align-items: center; }
.item-name { color: #ccc; font-size: 0.95rem; }
.item-val { color: #00d9ff; font-weight: bold; font-size: 1.05rem; direction: ltr; }
.section-title { font-size: 0.9rem; color: #7b61ff; font-weight: bold; margin: 14px 0 4px; }
.section-title.ind { color: #ff6496; }
.coil-result {
  background: linear-gradient(135deg, rgba(255,100,150,0.12), rgba(123,97,255,0.1));
  border: 1px solid rgba(255,100,150,0.4);
  border-radius: 16px;
  padding: 16px;
  margin-top: 16px;
}
.coil-title { font-size: 1rem; color: #ff6496; font-weight: bold; margin-bottom: 10px; }
.lang-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.lang-row select { width: auto; padding: 8px 12px; font-size: 0.85rem; }
.wiring-box {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.wiring-title {
  font-size: 0.95rem;
  color: #00ff88;
  font-weight: bold;
  margin-bottom: 12px;
}
.wiring-card {
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.wiring-card.hp { border: 1px solid rgba(0,217,255,0.4); background: rgba(0,217,255,0.05); }
.wiring-card.lp { border: 1px solid rgba(255,100,150,0.4); background: rgba(255,100,150,0.05); }
.wiring-header {
  font-size: 0.9rem;
  font-weight: bold;
  margin-bottom: 12px;
}
.wiring-header.hp { color: #00d9ff; }
.wiring-header.lp { color: #ff6496; }
.schematic {
  direction: ltr;
  font-family: monospace;
  font-size: 0.8rem;
  padding: 14px;
  background: rgba(0,0,0,0.35);
  border-radius: 8px;
  line-height: 1.7;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  text-align: left;
}
.sch-cap { color: #00d9ff; font-weight: bold; }
.sch-ind { color: #ff6496; font-weight: bold; }
.sch-spk { color: #00ff88; font-weight: bold; }
.sch-dot { color: #fff; }
.sch-wire { color: #666; }
.instruction {
  font-size: 0.82rem;
  padding: 8px 10px;
  border-radius: 8px;
  margin-top: 6px;
  line-height: 1.5;
}
.instruction.cap {
  background: rgba(0,217,255,0.08);
  border-right: 3px solid #00d9ff;
  color: #b0e0ff;
}
.instruction.ind {
  background: rgba(255,100,150,0.08);
  border-right: 3px solid #ff6496;
  color: #ffb0c8;
}
.instruction strong { color: #fff; }
.summary-box {
  margin-top: 12px;
  padding: 10px;
  background: rgba(255,204,0,0.08);
  border-radius: 8px;
  font-size: 0.78rem;
  color: #ffcc00;
  line-height: 1.7;
  text-align: center;
}
.combo-card {
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border-right: 4px solid #00ff88;
  background: rgba(0,0,0,0.2);
}
.combo-card.series { border-color: #ffcc00; }
.combo-header {
  font-size: 0.85rem;
  font-weight: bold;
  color: #00ff88;
  margin-bottom: 8px;
}
.combo-header.series { color: #ffcc00; }
.combo-formula {
  font-size: 0.85rem;
  color: #fff;
  direction: ltr;
  padding: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  margin-bottom: 6px;
  text-align: center;
  font-weight: bold;
}
.combo-result-val {
  font-size: 1rem;
  color: #00ff88;
  font-weight: bold;
  direction: ltr;
  text-align: center;
  padding: 6px;
  background: rgba(0,255,136,0.1);
  border-radius: 6px;
}
.combo-result-val.series { color: #ffcc00; background: rgba(255,204,0,0.1); }
.combo-diff {
  font-size: 0.75rem;
  color: #aaa;
  text-align: center;
  margin-top: 4px;
}
.no-result {
  text-align: center;
  color: #ff4466;
  font-size: 0.85rem;
  padding: 15px;
}
.slider-container { margin: 16px 0; }
.slider-container input[type="range"] {
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, #00d9ff, #ff6496);
  outline: none;
  -webkit-appearance: none;
}
.slider-container input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,217,255,0.5);
}
.freq-display {
  font-size: 2rem;
  font-weight: bold;
  color: #ffcc00;
  text-align: center;
  direction: ltr;
  margin: 10px 0;
}
.quick-freq {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.quick-freq button {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #1a1a2e;
  color: #aaa;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: inherit;
}
#freq_chart {
  width: 100%;
  height: 250px;
  display: block;
}
</style>
</head>
<body>

<div class="container">

  <div class="lang-row">
    <select id="lang" onchange="changeLang()">
      <option value="fa">🇮🇷 فارسی</option>
      <option value="en">🇬🇧 English</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="hi">🇮🇳 हिन्दी</option>
    </select>
  </div>

  <h1 id="t_title">🔊 محاسبه کراس‌اور</h1>
  <p class="subtitle" id="t_sub">محاسبه دقیق فیلتر</p>

  <div class="card">
    <label id="t_mode">حالت محاسبه:</label>
    <div class="btn-group">
      <button id="btn_mode1" class="active" onclick="setMode('normal')">🔧 فرکانس ← خازن</button>
      <button id="btn_mode2" onclick="setMode('reverse')">🔄 خازن ← فرکانس</button>
    </div>
    <label id="t_filter">نوع فیلتر:</label>
    <div class="btn-group">
      <button id="btn-hp" class="active" onclick="setDir('hp')">⬆️ بالاگذر</button>
      <button id="btn-lp" onclick="setDir('lp')">⬇️ پایین‌گذر</button>
    </div>
    <label>
      <span id="t_order">مرتبه فیلتر:</span>
      <span class="badge" id="order-badge">12 dB/oct</span>
    </label>
    <div class="order-group">
      <button onclick="setOrder(1, this)">1<small>6dB</small></button>
      <button class="active" onclick="setOrder(2, this)">2<small>12dB</small></button>
      <button onclick="setOrder(3, this)">3<small>18dB</small></button>
      <button onclick="setOrder(4, this)">4<small>24dB</small></button>
      <button onclick="setOrder(5, this)">5<small>30dB</small></button>
      <button onclick="setOrder(6, this)">6<small>36dB</small></button>
      <button onclick="setOrder(7, this)">7<small>42dB</small></button>
      <button onclick="setOrder(8, this)">8<small>48dB</small></button>
    </div>
    <div id="normal-inputs">
      <label id="t_freq">فرکانس قطع (Hz)</label>
      <input type="number" id="freq" value="3000">
    </div>
    <div id="reverse-inputs" style="display:none;">
      <label id="t_cap">ظرفیت خازن</label>
      <input type="number" id="cap_input" value="6.63" step="0.01">
      <label id="t_unit">واحد:</label>
      <div class="btn-group">
        <button id="u_nf" onclick="setUnit('nF')">nF</button>
        <button id="u_uf" class="active" onclick="setUnit('uF')">µF</button>
        <button id="u_mf" onclick="setUnit('mF')">mF</button>
      </div>
    </div>
    <label id="t_imp">امپدانس بلندگو (Ω)</label>
    <input type="number" id="impedance" value="8">
    <div class="action-row">
      <button class="calc-btn" id="t_calcbtn" onclick="calcCrossover()">محاسبه کن</button>
      <button class="reset-btn" id="t_resetbtn" onclick="resetCrossover()">پاک</button>
    </div>
  </div>

  <div id="output"></div>

  <div class="card" id="chart_card" style="display:none; border-color: rgba(0,217,255,0.4);">
    <label style="font-size:1rem; color:#00d9ff; font-weight:bold;" id="t_charttitle">📊 نمودار پاسخ فرکانسی</label>
    <div style="margin-top:14px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px;">
      <canvas id="freq_chart"></canvas>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:0.7rem; color:#888;">
      <span>20 Hz</span>
      <span>200 Hz</span>
      <span>2 kHz</span>
      <span>20 kHz</span>
    </div>
  </div>

  <div class="card" style="border-color: rgba(255,100,150,0.3);">
    <label style="font-size:1rem; color:#ff6496; font-weight:bold;" id="t_coiltitle">🧵 محاسبه سیم‌پیچی سلف</label>
    <label id="t_core">قطر هسته (mm)</label>
    <input type="number" id="core_d" value="20">
    <label id="t_mh">مقدار سلف (mH)</label>
    <input type="number" id="target_mh" value="0.5" step="0.01">
    <label id="t_wire">قطر سیم (mm)</label>
    <input type="number" id="wire_d" value="1.0" step="0.1">
    <div class="action-row">
      <button class="coil-btn" id="t_coilbtn" onclick="calcCoil()">محاسبه سیم‌پیچ</button>
      <button class="reset-btn" id="t_coilreset" onclick="resetCoil()">پاک</button>
    </div>
  </div>

  <div id="coil_output"></div>

  <div class="card" style="border-color: rgba(0,255,136,0.3);">
    <label style="font-size:1rem; color:#00ff88; font-weight:bold;" id="t_boxtitle">🎸 محاسبه باکس ساب</label>
    <label id="t_porttype">نوع پورت:</label>
    <div class="btn-group">
      <button id="port_circle" class="active" onclick="setPortType('circle')"><span id="t_circle">🔵 دایره‌ای</span></button>
      <button id="port_rect" onclick="setPortType('rect')"><span id="t_rect">🟦 مستطیلی</span></button>
    </div>
    <div id="port_circle_inputs">
      <label id="t_pdiam">قطر پورت (cm)</label>
      <input type="number" id="port_diameter" value="10" step="0.1">
    </div>
    <div id="port_rect_inputs" style="display:none;">
      <label id="t_pwidth">عرض پورت (cm)</label>
      <input type="number" id="port_width" value="15" step="0.1">
      <label id="t_pheight">ارتفاع پورت (cm)</label>
      <input type="number" id="port_height" value="5" step="0.1">
    </div>
    <label id="t_pcount">تعداد پورت:</label>
    <div class="btn-group">
      <button id="p1" class="active" onclick="setPortCount(1)">1</button>
      <button id="p2" onclick="setPortCount(2)">2</button>
      <button id="p3" onclick="setPortCount(3)">3</button>
      <button id="p4" onclick="setPortCount(4)">4</button>
    </div>
    <label id="t_boxvol">حجم جعبه (لیتر)</label>
    <input type="number" id="box_volume" value="50" step="1">
    <label id="t_tuning">فرکانس تیونینگ (Hz)</label>
    <input type="number" id="tuning_freq" value="35" step="0.5">
    <div class="action-row">
      <button class="box-btn" id="t_boxbtn" onclick="calcBox()">محاسبه کن</button>
      <button class="reset-btn" id="t_boxreset" onclick="resetBox()">پاک</button>
    </div>
    <div id="box_output"></div>
  </div>

  <div class="card" style="border-color: rgba(255,204,0,0.3);">
    <label style="font-size:1rem; color:#ffcc00; font-weight:bold;" id="t_combotitle">🔗 ترکیب سری و موازی خازن</label>
    <label id="t_combotarget">مقدار خازن مورد نیاز (µF)</label>
    <input type="number" id="combo_target" value="6.63" step="0.01">
    <label id="t_comboavail">خازن‌هایی که داری (با کاما جدا کن)</label>
    <input type="text" id="combo_available" value="1, 1.8, 2.2, 3.3, 4.7, 5.6, 6.8, 10, 12, 15, 22" style="direction:ltr;">
    <div class="action-row">
      <button class="tone-btn" id="t_combobtn" onclick="calcCombo()">پیدا کن</button>
      <button class="reset-btn" id="t_comborset" onclick="resetCombo()">پاک</button>
    </div>
    <div id="combo_output"></div>
  </div>

  <div class="card" style="border-color: rgba(255,204,0,0.3);">
    <label style="font-size:1rem; color:#ffcc00; font-weight:bold;" id="t_tonetitle">🔊 تستر بلندگو</label>
    <div class="freq-display" id="freq_display">1000 Hz</div>
    <div class="slider-container">
      <input type="range" id="freq_slider" min="20" max="20000" value="1000" step="1" oninput="updateFreqDisplay()">
    </div>
    <div class="quick-freq">
      <button onclick="setQuickFreq(50)">50 Hz</button>
      <button onclick="setQuickFreq(100)">100 Hz</button>
      <button onclick="setQuickFreq(500)">500 Hz</button>
      <button onclick="setQuickFreq(1000)">1 kHz</button>
      <button onclick="setQuickFreq(5000)">5 kHz</button>
      <button onclick="setQuickFreq(10000)">10 kHz</button>
    </div>
    <div class="action-row" style="margin-top:16px;">
      <button id="play_btn" class="tone-btn" onclick="toggleTone()">▶️ پخش</button>
    </div>
  </div>

</div>

<script>
var TRANSLATIONS = {
  fa: {
    title:"🔊 محاسبه کراس‌اور", sub:"محاسبه دقیق فیلتر",
    mode:"حالت محاسبه:", mode1:"🔧 فرکانس ← خازن", mode2:"🔄 خازن ← فرکانس",
    filter:"نوع فیلتر:", hp:"⬆️ بالاگذر", lp:"⬇️ پایین‌گذر",
    order:"مرتبه فیلتر:", freq:"فرکانس قطع (Hz)", cap:"ظرفیت خازن", unit:"واحد:", imp:"امپدانس بلندگو (Ω)",
    calc:"محاسبه کن", reset:"پاک",
    slope:"📉 شیب قطع فیلتر", order_label:"مرتبه", hp_lbl:"بالاگذر", lp_lbl:"پایین‌گذر",
    caps:"🔵 خازن‌ها", inds:"🟣 سلف‌ها", freq_result:"🎯 فرکانس قطع",
    coil_title:"🧵 محاسبه سیم‌پیچی سلف", core:"قطر هسته (mm)", mh:"مقدار سلف (mH)", wire:"قطر سیم (mm)",
    coil_btn:"محاسبه سیم‌پیچ", turns:"تعداد دور", wire_len:"متراژ سیم", coil_len:"طول سیم‌پیچ", meter:"متر", turn:"دور",
    error:"⚠️ مقادیر معتبر وارد کنید",
    wiring:"🔌 نقشه سیم‌کشی", hp_title:"⬆️ بالاگذر (توییتر)", lp_title:"⬇️ پایین‌گذر (ووفر)",
    series_with_spk:"سری با بلندگو", parallel_with_spk:"موازی با بلندگو",
    rule:"قانون: خازن سری — سلف موازی", rule_lp:"قانون: سلف سری — خازن موازی",
    box_title:"🎸 محاسبه باکس ساب", port_type:"نوع پورت:", circle:"🔵 دایره‌ای", rect:"🟦 مستطیلی",
    port_diameter:"قطر پورت (cm)", port_width:"عرض پورت (cm)", port_height:"ارتفاع پورت (cm)",
    port_count:"تعداد پورت:", box_volume:"حجم جعبه (لیتر)", tuning_freq:"فرکانس تیونینگ (Hz)",
    box_result:"🎸 نتایج باکس ساب", eq_diameter:"قطر معادل", port_length:"طول پورت (هر کدام)",
    port_volume:"حجم پورت", net_volume:"حجم خالص جعبه", liter:"لیتر",
    combo_title:"🔗 ترکیب سری و موازی خازن", combo_target:"مقدار خازن مورد نیاز (µF)",
    combo_available:"خازن‌هایی که داری (با کاما جدا کن)", combo_btn:"پیدا کن",
    par:"🟢 موازی", ser:"🟡 سری", diff:"اختلاف", best_combos:"🎯 بهترین ترکیب‌ها:",
    no_result:"❌ ترکیبی پیدا نشد", tone_title:"🔊 تستر بلندگو", play:"▶️ پخش", stop:"⏹️ توقف",
    chart_title:"📊 نمودار پاسخ فرکانسی"
  },
  en: {
    title:"🔊 Crossover Calculator", sub:"Precise filter calculation",
    mode:"Mode:", mode1:"🔧 Freq → Cap", mode2:"🔄 Cap → Freq",
    filter:"Filter type:", hp:"⬆️ High-pass", lp:"⬇️ Low-pass",
    order:"Filter order:", freq:"Cutoff frequency (Hz)", cap:"Capacitor value", unit:"Unit:", imp:"Speaker impedance (Ω)",
    calc:"Calculate", reset:"Reset",

function formatCap(farad) {
  var uf = farad * 1e6;
  if (uf >= 1000) return (uf / 1000).toFixed(3) + ' mF';
  if (uf >= 1) return uf.toFixed(3) + ' µF';
  return (uf * 1000).toFixed(3) + ' nF';
}
function formatInd(henry) {
  var mh = henry * 1000;
  if (mh >= 1000) return (mh / 1000).toFixed(3) + ' H';
  return mh.toFixed(3) + ' mH';
}
function formatFreq(hz) {
  if (hz >= 1000) return (hz / 1000).toFixed(3) + ' kHz';
  return hz.toFixed(2) + ' Hz';
}

function getCoefficients(o) {
  var Q = { 1:[0.707], 2:[0.707,1.307], 3:[0.517,0.707,1.932], 4:[0.541,1.306,0.541,1.306], 5:[0.618,1.618,0.618,1.618,0.618], 6:[0.517,0.707,1.932,0.517,0.707,1.932], 7:[0.555,0.802,1.247,2.247,0.555,0.802,1.247], 8:[0.509,0.601,0.9,2.563,0.509,0.601,0.9,2.563] };
  var qs = Q[o] || [0.707];
  var caps = [], inds = [];
  for (var i = 0; i < qs.length; i++) caps.push({ name: 'C' + (i + 1), coef: 1 / (2 * qs[i]) });
  var numInd = Math.floor(o / 2);
  for (var j = 0; j < numInd; j++) inds.push({ name: 'L' + (j + 1), coef: 2 * qs[j] });
  return { caps: caps, inds: inds };
}

function calcFilterResponse(freq, fc, ord, dir) {
  var ratio = freq / fc;
  var H = 0;
  if (dir === 'hp') {
    H = Math.pow(ratio, ord) / Math.sqrt(1 + Math.pow(ratio, 2 * ord));
  } else {
    H = 1 / Math.sqrt(1 + Math.pow(ratio, 2 * ord));
  }
  if (H <= 0) return -60;
  var dB = 20 * Math.log10(H);
  return Math.max(dB, -60);
}

function drawChart(fc, ord, dir) {
  var canvas = document.getElementById('freq_chart');
  if (!canvas) return;
  var card = document.getElementById('chart_card');
  if (card) card.style.display = 'block';
  
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  
  var ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  
  var W = rect.width;
  var H = rect.height;
  var padding = { top: 20, right: 15, bottom: 15, left: 42 };
  var plotW = W - padding.left - padding.right;
  var plotH = H - padding.top - padding.bottom;
  
  ctx.clearRect(0, 0, W, H);
  
  var fMin = 20;
  var fMax = 20000;
  var logMin = Math.log10(fMin);
  var logMax = Math.log10(fMax);
  var dbMin = -60;
  var dbMax = 6;
  var dbRange = dbMax - dbMin;
  
  function freqToX(f) {
    var logF = Math.log10(f);
    return padding.left + ((logF - logMin) / (logMax - logMin)) * plotW;
  }
  function dbToY(db) {
    return padding.top + ((dbMax - db) / dbRange) * plotH;
  }
  
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#8888aa';
  ctx.font = '9px Tahoma';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  
  var dbLines = [6, 0, -6, -12, -18, -24, -30, -36, -42, -48, -54, -60];
  for (var d = 0; d < dbLines.length; d++) {
    var y = dbToY(dbLines[d]);
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(W - padding.right, y);
    ctx.stroke();
    ctx.fillText(dbLines[d] + ' dB', padding.left - 4, y);
  }
  
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var freqLines = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
  for (var f = 0; f < freqLines.length; f++) {
    var x = freqToX(freqLines[f]);
    ctx.beginPath();
    ctx.moveTo(x, padding.top);
    ctx.lineTo(x, H - padding.bottom);
    ctx.stroke();
  }
  
  var fcX = freqToX(fc);
  ctx.strokeStyle = 'rgba(255,204,0,0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(fcX, padding.top);
  ctx.lineTo(fcX, H - padding.bottom);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 10px Tahoma';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var fcLabel = fc >= 1000 ? (fc / 1000).toFixed(1) + 'k' : fc.toFixed(0);
  ctx.fillText(fcLabel + ' Hz', fcX, padding.top + 4);
  
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding.left, dbToY(0));
  ctx.lineTo(W - padding.right, dbToY(0));
  ctx.stroke();
  
  ctx.strokeStyle = dir === 'hp' ? '#00d9ff' : '#ff6496';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  var firstPoint = true;
  for (var i = 0; i <= 200; i++) {
    var logF = logMin + (i / 200) * (logMax - logMin);
    var freq = Math.pow(10, logF);
    var db = calcFilterResponse(freq, fc, ord, dir);
    var x = freqToX(freq);
    var y = dbToY(db);
    if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
    else { ctx.lineTo(x, y); }
  }
  ctx.stroke();
  
  var fcDb = calcFilterResponse(fc, fc, ord, dir);
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.arc(fcX, dbToY(fcDb), 5, 0, 2 * Math.PI);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 10px Tahoma';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(fcDb.toFixed(1) + ' dB', fcX + 8, dbToY(fcDb));
}

function hideChart() {

  if (card) card.style.display = 'none';

function calcCrossover() {
  var T = TRANSLATIONS[currentLang];
  var R = parseFloat(document.getElementById('impedance').value);
  if (!R || R <= 0) {
    document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
    hideChart();
    return;
  }
  var slope = 6 * order;
  var html = '<div class="result-box">';
  if (mode === 'normal') {
    var freq = parseFloat(document.getElementById('freq').value);
    if (!freq || freq <= 0) {
      document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
      hideChart();
      return;
    }
    var w = 2 * Math.PI * freq;
    var coefs = getCoefficients(order);
    var caps = [], inds = [];
    for (var i = 0; i < coefs.caps.length; i++) caps.push({ name: coefs.caps[i].name, value: coefs.caps[i].coef / (w * R) });
    for (var j = 0; j < coefs.inds.length; j++) inds.push({ name: coefs.inds[j].name, value: coefs.inds[j].coef * R / w });
    html += '<div class="slope-box"><div class="slope-lbl">' + T.slope + '</div><div class="slope-val">' + slope + ' dB/oct</div><div class="slope-lbl">' + T.order_label + ' ' + order + ' — ' + (direction === 'hp' ? T.hp_lbl : T.lp_lbl) + '</div></div>';
    if (caps.length > 0) {
      html += '<div class="section-title">' + T.caps + ' (' + caps.length + ')</div>';
      for (var k = 0; k < caps.length; k++) html += '<div class="item"><div class="item-row"><span class="item-name">' + caps[k].name + '</span><span class="item-val">' + formatCap(caps[k].value) + '</span></div></div>';
    }
    if (inds.length > 0) {
      html += '<div class="section-title ind">' + T.inds + ' (' + inds.length + ')</div>';
      for (var p = 0; p < inds.length; p++) html += '<div class="item"><div class="item-row"><span class="item-name">' + inds[p].name + '</span><span class="item-val" style="color:#ff6496;">' + formatInd(inds[p].value) + '</span></div></div>';
    }
    html += '<div class="wiring-box"><div class="wiring-title">' + T.wiring + '</div>';
    if (direction === 'hp') {
      html += '<div class="wiring-card hp"><div class="wiring-header hp">' + T.hp_title + '</div>';
      html += '<div class="schematic"><span class="sch-wire">──</span>';
      for (var c = 0; c < caps.length; c++) html += '<span class="sch-cap">[' + caps[c].name + ']</span><span class="sch-wire">──</span>';
      html += '<span class="sch-dot">●</span><span class="sch-wire">──</span><span class="sch-spk">[ 🔊 ]</span><span class="sch-wire">──</span><br>';
      html += '<span style="display:inline-block; width:100%; text-align:center; color:#fff;">│</span><br>';
      for (var d = 0; d < inds.length; d++) html += '<span class="sch-ind">[' + inds[d].name + ']</span><br>';
      html += '<span style="color:#fff;">│</span><br><span class="sch-wire">──</span></div>';
      for (var e = 0; e < caps.length; e++) html += '<div class="instruction cap">🔵 <strong>' + caps[e].name + '</strong> (' + formatCap(caps[e].value) + ') — ' + T.series_with_spk + '</div>';
      for (var f = 0; f < inds.length; f++) html += '<div class="instruction ind">🟣 <strong>' + inds[f].name + '</strong> (' + formatInd(inds[f].value) + ') — ' + T.parallel_with_spk + '</div>';
      html += '</div><div class="summary-box">' + T.rule + '</div>';
    } else {
      html += '<div class="wiring-card lp"><div class="wiring-header lp">' + T.lp_title + '</div>';
      html += '<div class="schematic"><span class="sch-wire">──</span>';
      for (var g = 0; g < inds.length; g++) html += '<span class="sch-ind">[' + inds[g].name + ']</span><span class="sch-wire">──</span>';
      html += '<span class="sch-dot">●</span><span class="sch-wire">──</span><span class="sch-spk">[ 🔊 ]</span><span class="sch-wire">──</span><br>';
      html += '<span style="display:inline-block; width:100%; text-align:center; color:#fff;">│</span><br>';
      for (var h = 0; h < caps.length; h++) html += '<span class="sch-cap">[' + caps[h].name + ']</span><br>';
      html += '<span style="color:#fff;">│</span><br><span class="sch-wire">──</span></div>';
      for (var m = 0; m < inds.length; m++) html += '<div class="instruction ind">🟣 <strong>' + inds[m].name + '</strong> (' + formatInd(inds[m].value) + ') — ' + T.series_with_spk + '</div>';
      for (var n = 0; n < caps.length; n++) html += '<div class="instruction cap">🔵 <strong>' + caps[n].name + '</strong> (' + formatCap(caps[n].value) + ') — ' + T.parallel_with_spk + '</div>';
      html += '</div><div class="summary-box">' + T.rule_lp + '</div>';
    }
    html += '</div>';
    document.getElementById('output').innerHTML = html;
    drawChart(freq, order, direction);
  } else {
    var capVal = parseFloat(document.getElementById('cap_input').value);
    if (!capVal || capVal <= 0) {
      document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
      hideChart();
      return;
    }
    var capFarad = capVal * UNIT_TO_FARAD[unit];
    var coefs2 = getCoefficients(order);
    var fcVal = coefs2.caps[0].coef / (2 * Math.PI * capFarad * R);
    html += '<div class="slope-box"><div class="slope-lbl">' + T.freq_result + '</div><div class="slope-val">' + formatFreq(fcVal) + '</div><div class="slope-lbl">' + T.order_label + ' ' + order + ' — ' + (direction === 'hp' ? T.hp_lbl : T.lp_lbl) + '</div></div>';
    html += '<div class="section-title">' + T.freq_result + '</div>';
    for (var q = 0; q < coefs2.caps.length; q++) {
      var f2 = coefs2.caps[q].coef / (2 * Math.PI * capFarad * R);
      html += '<div class="item"><div class="item-row"><span class="item-name">' + coefs2.caps[q].name + '</span><span class="item-val">' + formatFreq(f2) + '</span></div></div>';
    }
    html += '</div>';
    document.getElementById('output').innerHTML = html;
    drawChart(fcVal, order, direction);
  }
  document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function calcCoil() {
  var T = TRANSLATIONS[currentLang];
  var coreD_mm = parseFloat(document.getElementById('core_d').value);
  var target_mh = parseFloat(document.getElementById('target_mh').value);
  var wireD_mm = parseFloat(document.getElementById('wire_d').value);
  if (isNaN(coreD_mm) || isNaN(target_mh) || isNaN(wireD_mm) || coreD_mm <= 0 || target_mh <= 0 || wireD_mm <= 0) {
    document.getElementById('coil_output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
    return;
  }
  var r_cm = (coreD_mm / 2) / 10;
  var D_cm = coreD_mm / 10;
  var L_uH = target_mh * 1000;
  var wireD_cm = wireD_mm / 10;
  var N = Math.sqrt(L_uH / r_cm);
  for (var i = 0; i < 100; i++) {
    var l = N * wireD_cm;
    var newN = Math.sqrt(L_uH * (9 * r_cm + 10 * l) / (r_cm * r_cm));
    if (Math.abs(newN - N) < 0.001) { N = newN; break; }
    N = newN;
  }
  N = Math.ceil(N);
  var coilLength_cm = N * wireD_cm;
  var wireLength_m = (N * Math.PI * D_cm) / 100;
  var html = '<div class="coil-result"><div class="coil-title">' + T.coil_title + '</div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.turns + '</span><span class="item-val" style="color:#ff6496;">' + N + ' ' + T.turn + '</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.wire_len + '</span><span class="item-val" style="color:#ff6496;">' + wireLength_m.toFixed(3) + ' ' + T.meter + '</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.coil_len + '</span><span class="item-val" style="color:#ff6496;">' + coilLength_cm.toFixed(3) + ' cm</span></div></div>';
  html += '</div>';
  document.getElementById('coil_output').innerHTML = html;
  document.getElementById('coil_output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function calcBox() {
  var T = TRANSLATIONS[currentLang];
  var Vb = parseFloat(document.getElementById('box_volume').value);
  var Fb = parseFloat(document.getElementById('tuning_freq').value);
  if (!Vb || !Fb || Vb <= 0 || Fb <= 0) {
    document.getElementById('box_output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
    return;
  }
  var Deq = 0, area = 0;
  if (portType === 'circle') {
    var D = parseFloat(document.getElementById('port_diameter').value);
    if (!D || D <= 0) return;
    Deq = D;
    area = Math.PI * Math.pow(D / 2, 2);
  } else {
    var W = parseFloat(document.getElementById('port_width').value);
    var H = parseFloat(document.getElementById('port_height').value);
    if (!W || !H || W <= 0 || H <= 0) return;
    area = W * H;
    Deq = Math.sqrt(4 * W * H / Math.PI);
  }
  var L = (23562.5 * Deq * Deq * portCount) / (Fb * Fb * Vb) - 0.732 * Deq;
  var portVolume = area * L * portCount / 1000;
  var netVolume = Vb - portVolume;
  var html = '<div class="result-box" style="border-color: rgba(0,255,136,0.4); background: linear-gradient(135deg, rgba(0,255,136,0.08), rgba(0,217,255,0.05));">';
  html += '<div style="font-size:1rem; color:#00ff88; font-weight:bold; margin-bottom:12px;">' + T.box_result + '</div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.port_type + '</span><span class="item-val" style="color:#00ff88;">' + (portType === 'circle' ? T.circle : T.rect) + '</span></div></div>';
  if (portType === 'rect') html += '<div class="item"><div class="item-row"><span class="item-name">' + T.eq_diameter + '</span><span class="item-val" style="color:#00ff88;">' + Deq.toFixed(2) + ' cm</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.port_count + '</span><span class="item-val" style="color:#00ff88;">' + portCount + '</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.port_length + '</span><span class="item-val" style="color:#00ff88; font-size:1.2rem;">' + L.toFixed(2) + ' cm</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.port_volume + '</span><span class="item-val" style="color:#00ff88;">' + portVolume.toFixed(2) + ' ' + T.liter + '</span></div></div>';
  html += '<div class="item"><div class="item-row"><span class="item-name">' + T.net_volume + '</span><span class="item-val" style="color:#00ff88;">' + netVolume.toFixed(2) + ' ' + T.liter + '</span></div></div>';
  html += '</div>';
  document.getElementById('box_output').innerHTML = html;
}
function resetBox() {
  document.getElementById('port_diameter').value = '10';
  document.getElementById('port_width').value = '15';
  document.getElementById('port_height').value = '5';
  document.getElementById('box_volume').value = '50';
  document.getElementById('tuning_freq').value = '35';
  document.getElementById('box_output').innerHTML = '';
}

function calcCombo() {
  var T = TRANSLATIONS[currentLang];
  var target = parseFloat(document.getElementById('combo_target').value);
  var availableStr = document.getElementById('combo_available').value;
  var available = availableStr.split(',').map(function(x) { return parseFloat(x.trim()); }).filter(function(x) { return !isNaN(x) && x > 0; });
  if (!target || target <= 0 || available.length === 0) {
    document.getElementById('combo_output').innerHTML = '<div class="no-result">' + T.error + '</div>';
    return;
  }
  var results = [];
  for (var i = 0; i < available.length; i++) {
    for (var j = i; j < available.length; j++) {
      var par = available[i] + available[j];
      var diff = Math.abs(par - target);
      if (diff / target < 0.1) results.push({ type: 'par', a: available[i], b: available[j], result: par, diff: diff });
    }
  }
  for (var i = 0; i < available.length; i++) {
    for (var j = i; j < available.length; j++) {
      var ser = 1 / (1 / available[i] + 1 / available[j]);
      var diff = Math.abs(ser - target);
      if (diff / target < 0.1) results.push({ type: 'ser', a: available[i], b: available[j], result: ser, diff: diff });
    }
  }
  results.sort(function(a, b) { return a.diff - b.diff; });
  results = results.slice(0, 5);
  if (results.length === 0) {
    document.getElementById('combo_output').innerHTML = '<div class="no-result">' + T.no_result + '</div>';
    return;
  }
  var html = '<div style="margin-top:14px;"><div style="font-size:0.9rem; color:#ffcc00; font-weight:bold; margin-bottom:10px;">' + T.best_combos + '</div>';
  for (var k = 0; k < results.length; k++) {
    var r = results[k];
    var pct = (r.diff / target * 100).toFixed(1);
    var cls = r.type === 'par' ? '' : 'series';
    var icon = r.type === 'par' ? T.par : T.ser;
    var symbol = r.type === 'par' ? '+' : '—';
    html += '<div class="combo-card ' + cls + '">';
    html += '<div class="combo-header ' + cls + '">' + icon + '</div>';
    html += '<div class="combo-formula">' + r.a + ' µF ' + symbol + ' ' + r.b + ' µF = ' + r.result.toFixed(2) + ' µF</div>';
    html += '<div class="combo-result-val ' + cls + '">' + r.result.toFixed(3) + ' µF</div>';
    html += '<div class="combo-diff">' + T.diff + ': ' + pct + '%</div>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('combo_output').innerHTML = html;
}
function resetCombo() {
  document.getElementById('combo_target').value = '6.63';
  document.getElementById('combo_available').value = '1, 1.8, 2.2, 3.3, 4.7, 5.6, 6.8, 10, 12, 15, 22';
  document.getElementById('combo_output').innerHTML = '';
}

var audioCtx = null;
var oscillator = null;
var isPlaying = false;
function updateFreqDisplay() {
  var freq = document.getElementById('freq_slider').value;
  document.getElementById('freq_display').textContent = freq + ' Hz';
  if (oscillator && isPlaying) oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
}
function setQuickFreq(freq) {
  document.getElementById('freq_slider').value = freq;
  updateFreqDisplay();
}
function toggleTone() {
  if (!isPlaying) startTone();
  else stopTone();
}
function startTone() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    oscillator = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.value = parseFloat(document.getElementById('freq_slider').value);
    gain.gain.value = 0.3;
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.start();
    isPlaying = true;
    document.getElementById('play_btn').innerHTML = TRANSLATIONS[currentLang].stop;
  } catch (e) {
    alert('Error: Browser does not support audio');
  }
}
function stopTone() {
  if (oscillator) { oscillator.stop(); oscillator = null; }
  isPlaying = false;
  document.getElementById('play_btn').innerHTML = TRANSLATIONS[currentLang].play;
}

function resetCrossover() {
  document.getElementById('freq').value = '3000';
  document.getElementById('cap_input').value = '6.63';
  document.getElementById('impedance').value = '8';
  document.getElementById('output').innerHTML = '';
  hideChart();
}
function resetCoil() {
  document.getElementById('core_d').value = '20';
  document.getElementById('target_mh').value = '0.5';
  document.getElementById('wire_d').value = '1.0';
  document.getElementById('coil_output').innerHTML = '';
}

window.onload = function() {
  changeLang();
  updateFreqDisplay();
  setTimeout(calcCrossover, 300);
  
  window.addEventListener('resize', function() {
    var chartCard = document.getElementById('chart_card');
    if (chartCard && chartCard.style.display !== 'none') {
      var R = parseFloat(document.getElementById('impedance').value);
      if (mode === 'normal') {
        var freq = parseFloat(document.getElementById('freq').value);
        if (freq && R) drawChart(freq, order, direction);
      } else {
        var capVal = parseFloat(document.getElementById('cap_input').value);
        if (capVal && R) {
          var capFaradX = capVal * UNIT_TO_FARAD[unit];
          var coefsX = getCoefficients(order);
          var fcX_val = coefsX.caps[0].coef / (2 * Math.PI * capFaradX * R);
          drawChart(fcX_val, order, direction);
        }
      }
    }
  });
};
</script>
