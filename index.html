<meta charset="UTF-8">

<title>Crossover Calculator</title>

<!-- ═══════════════════════════════════════════
     استایل‌های ظاهری اپ
     ═══════════════════════════════════════════ -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* بدنه اصلی اپ */
body {
  font-family: Tahoma, sans-serif;
  background: linear-gradient(160deg, #0f0f1e, #1a1a2e, #16213e);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 40px;
}

/* ظرف اصلی */
.container { max-width: 480px; margin: 0 auto; }

/* عنوان اصلی */
h1 { text-align: center; font-size: 1.4rem; color: #00d9ff; margin-bottom: 6px; }

/* زیرعنوان */
.subtitle { text-align: center; font-size: 0.8rem; color: #8888aa; margin-bottom: 16px; }

/* کارت‌های اصلی */
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

/* برچسب‌ها */
label { display: block; font-size: 0.85rem; color: #a0a0c0; margin: 12px 0 6px; }

/* ورودی‌ها و منوی کشویی */
input, select {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #0a0a1a;
  color: #fff;
  font-size: 1rem;
  text-align: center;
  direction: ltr;
  font-family: inherit;
}

/* حالت فوکوس ورودی */
input:focus, select:focus { outline: none; border-color: #00d9ff; }
select { cursor: pointer; }

/* گروه دکمه‌ها */
.btn-group { display: flex; gap: 6px; margin-bottom: 10px; }
.btn-group button, .order-group button {
  flex: 1;
  padding: 12px 6px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #1a1a2e;
  color: #aaa;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: inherit;
}

/* دکمه فعال */
.btn-group button.active, .order-group button.active {
  background: #00d9ff;
  color: #fff;
  border-color: #00d9ff;
  font-weight: bold;
}

/* گروه دکمه‌های مرتبه فیلتر */
.order-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.order-group button { font-size: 0.9rem; padding: 10px 4px; }

/* نشان شیب قطع */
.badge {
  display: inline-block;
  background: linear-gradient(135deg, #7b61ff, #ff6496);
  color: #fff;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: bold;
  margin-right: 6px;
}

/* ردیف دکمه‌های عمل */
.action-row { display: flex; gap: 8px; margin-top: 16px; }
.action-row button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
}

/* دکمه محاسبه */
.calc-btn { background: linear-gradient(135deg, #00d9ff, #0080ff); color: #fff; }

/* دکمه پاک */
.reset-btn { background: #2a2a3e; color: #aaa; }

/* دکمه سیم‌پیچی */
.coil-btn { background: linear-gradient(135deg, #ff6496, #7b61ff); color: #fff; }

/* کادر نتایج */
.result-box {
  background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(123,97,255,0.08));
  border: 1px solid rgba(0,217,255,0.3);
  border-radius: 16px;
  padding: 16px;
  margin-top: 16px;
}

/* کادر شیب قطع */
.slope-box {
  background: linear-gradient(135deg, rgba(123,97,255,0.15), rgba(255,100,150,0.1));
  border: 1px solid rgba(123,97,255,0.4);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  text-align: center;
}

/* مقدار شیب */
.slope-val {
  font-size: 1.8rem;
  font-weight: bold;
  color: #ff6496;
  direction: ltr;
  margin: 6px 0;
}

/* برچسب شیب */
.slope-lbl { font-size: 0.8rem; color: #aaa; }

/* آیتم‌های لیست */
.item {
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.item:last-child { border-bottom: none; }
.item-row { display: flex; justify-content: space-between; align-items: center; }
.item-name { color: #ccc; font-size: 0.95rem; }
.item-val { color: #00d9ff; font-weight: bold; font-size: 1.05rem; direction: ltr; }

/* عنوان بخش */
.section-title { font-size: 0.9rem; color: #7b61ff; font-weight: bold; margin: 14px 0 4px; }
.section-title.ind { color: #ff6496; }

/* کادر نتایج سیم‌پیچی */
.coil-result {
  background: linear-gradient(135deg, rgba(255,100,150,0.12), rgba(123,97,255,0.1));
  border: 1px solid rgba(255,100,150,0.4);
  border-radius: 16px;
  padding: 16px;
  margin-top: 16px;
}
.coil-title { font-size: 1rem; color: #ff6496; font-weight: bold; margin-bottom: 10px; }

/* ردیف انتخاب زبان */
.lang-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.lang-row select { width: auto; padding: 8px 12px; font-size: 0.85rem; }

/* ═══ نقشه سیم‌کشی ═══ */
.wiring-box {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.wiring-title {
  font-size: 0.95rem;
  color: #00ff88;
  font-weight: bold;
  margin-bottom: 12px;
}
.wiring-card {
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.wiring-card.hp { border: 1px solid rgba(0,217,255,0.4); background: rgba(0,217,255,0.05); }
.wiring-card.lp { border: 1px solid rgba(255,100,150,0.4); background: rgba(255,100,150,0.05); }
.wiring-header {
  font-size: 0.9rem;
  font-weight: bold;
  margin-bottom: 12px;
}
.wiring-header.hp { color: #00d9ff; }
.wiring-header.lp { color: #ff6496; }

/* شماتیک نقشه */
.schematic {
  direction: ltr;
  font-family: monospace;
  font-size: 0.8rem;
  padding: 14px;
  background: rgba(0,0,0,0.35);
  border-radius: 8px;
  line-height: 1.7;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  text-align: left;
}
.sch-cap { color: #00d9ff; font-weight: bold; }
.sch-ind { color: #ff6496; font-weight: bold; }
.sch-spk { color: #00ff88; font-weight: bold; }
.sch-dot { color: #fff; }
.sch-wire { color: #666; }

/* دستورالعمل نصب */
.instruction {
  font-size: 0.82rem;
  padding: 8px 10px;
  border-radius: 8px;
  margin-top: 6px;
  line-height: 1.5;
}
.instruction.cap {
  background: rgba(0,217,255,0.08);
  border-right: 3px solid #00d9ff;
  color: #b0e0ff;
}
.instruction.ind {
  background: rgba(255,100,150,0.08);
  border-right: 3px solid #ff6496;
  color: #ffb0c8;
}
.instruction strong { color: #fff; }

/* کادر خلاصه قانون */
.summary-box {
  margin-top: 12px;
  padding: 10px;
  background: rgba(255,204,0,0.08);
  border-radius: 8px;
  font-size: 0.78rem;
  color: #ffcc00;
  line-height: 1.7;
  text-align: center;
}
</style>

<body>

<div class="container">

  <!-- ═══ منوی انتخاب زبان (۱۰ زبان) ═══ -->
  <div class="lang-row">
    <select id="lang" onchange="changeLang()">
      <option value="fa">🇮🇷 فارسی</option>
      <option value="en">🇬🇧 English</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="hi">🇮🇳 हिन्दी</option>
    </select>
  </div>

  <!-- ═══ عنوان اپ ═══ -->
  <h1 id="t_title">🔊 محاسبه کراس‌اور</h1>
  <p class="subtitle" id="t_sub">محاسبه دقیق فیلتر</p>

  <!-- ═══════════════════════════════════════════
       کارت اصلی: محاسبه کراس‌اور
       ═══════════════════════════════════════════ -->
  <div class="card">

    <!-- حالت محاسبه: عادی یا معکوس -->
    <label id="t_mode">حالت محاسبه:</label>
    <div class="btn-group">
      <button id="btn_mode1" class="active" onclick="setMode('normal')">🔧 فرکانس ← خازن</button>
      <button id="btn_mode2" onclick="setMode('reverse')">🔄 خازن ← فرکانس</button>
    </div>

    <!-- نوع فیلتر: بالاگذر یا پایین‌گذر -->
    <label id="t_filter">نوع فیلتر:</label>
    <div class="btn-group">
      <button id="btn-hp" class="active" onclick="setDir('hp')">⬆️ بالاگذر</button>
      <button id="btn-lp" onclick="setDir('lp')">⬇️ پایین‌گذر</button>
    </div>

    <!-- مرتبه فیلتر: 1 تا 8 -->
    <label>
      <span id="t_order">مرتبه فیلتر:</span>
      <span class="badge" id="order-badge">12 dB/oct</span>
    </label>
    <div class="order-group">
      <button onclick="setOrder(1, this)">1<small>6dB</small></button>
      <button class="active" onclick="setOrder(2, this)">2<small>12dB</small></button>
      <button onclick="setOrder(3, this)">3<small>18dB</small></button>
      <button onclick="setOrder(4, this)">4<small>24dB</small></button>
      <button onclick="setOrder(5, this)">5<small>30dB</small></button>
      <button onclick="setOrder(6, this)">6<small>36dB</small></button>
      <button onclick="setOrder(7, this)">7<small>42dB</small></button>
      <button onclick="setOrder(8, this)">8<small>48dB</small></button>
    </div>

    <!-- ورودی حالت عادی: فرکانس -->
    <div id="normal-inputs">
      <label id="t_freq">فرکانس قطع (Hz)</label>
      <input type="number" id="freq" value="3000">
    </div>

    <!-- ورودی حالت معکوس: ظرفیت خازن -->
    <div id="reverse-inputs" style="display:none;">
      <label id="t_cap">ظرفیت خازن</label>
      <input type="number" id="cap_input" value="6.63" step="0.01">
      <label id="t_unit">واحد:</label>
      <div class="btn-group">
        <button id="u_nf" onclick="setUnit('nF')">nF</button>
        <button id="u_uf" class="active" onclick="setUnit('uF')">µF</button>
        <button id="u_mf" onclick="setUnit('mF')">mF</button>
      </div>
    </div>

    <!-- ورودی امپدانس -->
    <label id="t_imp">امپدانس بلندگو (Ω)</label>
    <input type="number" id="impedance" value="8">

    <!-- دکمه‌های محاسبه و پاک -->
    <div class="action-row">
      <button class="calc-btn" id="t_calcbtn" onclick="calcCrossover()">محاسبه کن</button>
      <button class="reset-btn" id="t_resetbtn" onclick="resetCrossover()">پاک</button>
    </div>

  </div>

  <!-- محل نمایش نتایج کراس‌اور -->
  <div id="output"></div>

  <!-- ═══════════════════════════════════════════
       کارت محاسبه سیم‌پیچی سلف
       ═══════════════════════════════════════════ -->
  <div class="card" style="border-color: rgba(255,100,150,0.3);">
    <label style="font-size:1rem; color:#ff6496; font-weight:bold;" id="t_coiltitle">🧵 محاسبه سیم‌پیچی سلف</label>

    <!-- قطر هسته -->
    <label id="t_core">قطر هسته (mm)</label>
    <input type="number" id="core_d" value="20">

    <!-- مقدار سلف -->
    <label id="t_mh">مقدار سلف (mH)</label>
    <input type="number" id="target_mh" value="0.5" step="0.01">

    <!-- قطر سیم -->
    <label id="t_wire">قطر سیم (mm)</label>
    <input type="number" id="wire_d" value="1.0" step="0.1">

    <!-- دکمه‌های سیم‌پیچی -->
    <div class="action-row">
      <button class="coil-btn" id="t_coilbtn" onclick="calcCoil()">محاسبه سیم‌پیچ</button>
      <button class="reset-btn" id="t_coilreset" onclick="resetCoil()">پاک</button>
    </div>

  </div>

  <!-- محل نمایش نتایج سیم‌پیچی -->
  <div id="coil_output"></div>

</div>

   متغیرهای اصلی
   ═══════════════════════════════════════════ */
var direction = 'hp';       /* hp = بالاگذر، lp = پایین‌گذر */

var UNIT_TO_FARAD = { 'nF': 1e-9, 'uF': 1e-6, 'mF': 1e-3 };

   ═══════════════════════════════════════════ */
function changeLang() {
  currentLang = document.getElementById('lang').value;
  var T = TRANSLATIONS[currentLang];
  document.getElementById('t_title').innerHTML = T.title;
  document.getElementById('t_sub').innerHTML = T.sub;
  document.getElementById('t_mode').innerHTML = T.mode;
  document.getElementById('btn_mode1').innerHTML = T.mode1;
  document.getElementById('btn_mode2').innerHTML = T.mode2;
  document.getElementById('t_filter').innerHTML = T.filter;
  document.getElementById('btn-hp').innerHTML = T.hp;
  document.getElementById('btn-lp').innerHTML = T.lp;
  document.getElementById('t_order').innerHTML = T.order;
  document.getElementById('t_freq').innerHTML = T.freq;
  document.getElementById('t_cap').innerHTML = T.cap;
  document.getElementById('t_unit').innerHTML = T.unit;
  document.getElementById('t_imp').innerHTML = T.imp;
  document.getElementById('t_calcbtn').innerHTML = T.calc;
  document.getElementById('t_resetbtn').innerHTML = T.reset;
  document.getElementById('t_coiltitle').innerHTML = T.coil_title;
  document.getElementById('t_core').innerHTML = T.core;
  document.getElementById('t_mh').innerHTML = T.mh;
  document.getElementById('t_wire').innerHTML = T.wire;
  document.getElementById('t_coilbtn').innerHTML = T.coil_btn;
  document.getElementById('t_coilreset').innerHTML = T.reset;

  /* تغییر جهت صفحه برای RTL و LTR */
  if (currentLang === 'ar' || currentLang === 'fa') {
    document.body.dir = 'rtl';
  } else {
    document.body.dir = 'ltr';
  }

  /* محاسبه مجدد اگر نتیجه نمایش داده شده */
  if (document.getElementById('output').innerHTML !== '') {
    calcCrossover();
  }
  if (document.getElementById('coil_output').innerHTML !== '') {
    calcCoil();
  }
}

/* ═══════════════════════════════════════════
   فرمت‌دهی خروجی
   ═══════════════════════════════════════════ */

/* نمایش ظرفیت خازن با واحد مناسب */
function formatCap(farad) {
  var uf = farad * 1e6;
  if (uf >= 1000) return (uf / 1000).toFixed(3) + ' mF';
  if (uf >= 1) return uf.toFixed(3) + ' µF';
  return (uf * 1000).toFixed(3) + ' nF';
}

/* نمایش اندوکتانس با واحد مناسب */
function formatInd(henry) {
  var mh = henry * 1000;
  if (mh >= 1000) return (mh / 1000).toFixed(3) + ' H';
  return mh.toFixed(3) + ' mH';
}

/* نمایش فرکانس با واحد مناسب */
function formatFreq(hz) {
  if (hz >= 1000) return (hz / 1000).toFixed(3) + ' kHz';
  return hz.toFixed(2) + ' Hz';
}

/* ═══════════════════════════════════════════
   ضرایب فیلتر Butterworth
   برای هر مرتبه، ضرایب Q هر طبقه
   ═══════════════════════════════════════════ */
function getCoefficients(o) {
  var Q = {
    1: [0.707],
    2: [0.707, 1.307],
    3: [0.517, 0.707, 1.932],
    4: [0.541, 1.306, 0.541, 1.306],
    5: [0.618, 1.618, 0.618, 1.618, 0.618],
    6: [0.517, 0.707, 1.932, 0.517, 0.707, 1.932],
    7: [0.555, 0.802, 1.247, 2.247, 0.555, 0.802, 1.247],
    8: [0.509, 0.601, 0.9, 2.563, 0.509, 0.601, 0.9, 2.563]
  };
  var qs = Q[o] || [0.707];
  var caps = [];
  var inds = [];
  
  /* محاسبه خازن‌ها بر اساس Q */
  for (var i = 0; i < qs.length; i++) {
    caps.push({ name: 'C' + (i + 1), coef: 1 / (2 * qs[i]) });
  }
  
  /* محاسبه سلف‌ها (تعداد = نصف مرتبه) */
  var numInd = Math.floor(o / 2);
  for (var j = 0; j < numInd; j++) {
    inds.push({ name: 'L' + (j + 1), coef: 2 * qs[j] });
  }
  return { caps: caps, inds: inds };
}

/* ═══════════════════════════════════════════
   محاسبه کراس‌اور (تابع اصلی)
   ═══════════════════════════════════════════ */
function calcCrossover() {
  var T = TRANSLATIONS[currentLang];
  var R = parseFloat(document.getElementById('impedance').value);

  /* بررسی اعتبار امپدانس */
  if (!R || R <= 0) {
    document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
    return;
  }

  var slope = 6 * order;
  var html = '<div class="result-box">';

  /* ═══ حالت عادی: فرکانس ← خازن ═══ */
  if (mode === 'normal') {
    var freq = parseFloat(document.getElementById('freq').value);
    if (!freq || freq <= 0) {
      document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
      return;
    }

    var w = 2 * Math.PI * freq;
    var coefs = getCoefficients(order);
    var caps = [];
    var inds = [];

    /* محاسبه مقدار خازن‌ها */
    for (var i = 0; i < coefs.caps.length; i++) {
      caps.push({ name: coefs.caps[i].name, value: coefs.caps[i].coef / (w * R) });
    }
    
    /* محاسبه مقدار سلف‌ها */
    for (var j = 0; j < coefs.inds.length; j++) {
      inds.push({ name: coefs.inds[j].name, value: coefs.inds[j].coef * R / w });
    }

    /* نمایش شیب قطع */
    html += '<div class="slope-box">';
    html += '<div class="slope-lbl">' + T.slope + '</div>';
    html += '<div class="slope-val">' + slope + ' dB/oct</div>';
    html += '<div class="slope-lbl">' + T.order_label + ' ' + order + ' — ' + (direction === 'hp' ? T.hp_lbl : T.lp_lbl) + '</div>';
    html += '</div>';

    /* نمایش لیست خازن‌ها */
    if (caps.length > 0) {
      html += '<div class="section-title">' + T.caps + ' (' + caps.length + ')</div>';
      for (var k = 0; k < caps.length; k++) {
        html += '<div class="item">';
        html += '<div class="item-row"><span class="item-name">' + caps[k].name + '</span>';
        html += '<span class="item-val">' + formatCap(caps[k].value) + '</span></div>';
        html += '</div>';
      }
    }

    /* نمایش لیست سلف‌ها */
    if (inds.length > 0) {
      html += '<div class="section-title ind">' + T.inds + ' (' + inds.length + ')</div>';
      for (var p = 0; p < inds.length; p++) {
        html += '<div class="item">';
        html += '<div class="item-row"><span class="item-name">' + inds[p].name + '</span>';
        html += '<span class="item-val" style="color:#ff6496;">' + formatInd(inds[p].value) + '</span></div>';
        html += '</div>';
      }
    }

    /* ═══ نقشه سیم‌کشی ═══ */
    html += '<div class="wiring-box">';
    html += '<div class="wiring-title">' + T.wiring + '</div>';

    /* حالت بالاگذر: خازن سری — سلف موازی */
    if (direction === 'hp') {
      html += '<div class="wiring-card hp">';
      html += '<div class="wiring-header hp">' + T.hp_title + '</div>';

      /* شماتیک */
      html += '<div class="schematic">';
      html += '<span class="sch-wire">──</span>';
      for (var c = 0; c < caps.length; c++) {
        html += '<span class="sch-cap">[' + caps[c].name + ']</span><span class="sch-wire">──</span>';
      }
      html += '<span class="sch-dot">●</span><span class="sch-wire">──</span>';
      html += '<span class="sch-spk">[ 🔊 ]</span>';
      html += '<span class="sch-wire">──</span><br>';
      html += '<span style="display:inline-block; width:100%; text-align:center; color:#fff;">│</span><br>';
      for (var d = 0; d < inds.length; d++) {
        html += '<span class="sch-ind">[' + inds[d].name + ']</span><br>';
      }
      html += '<span style="color:#fff;">│</span><br>';
      html += '<span class="sch-wire">──</span>';
      html += '</div>';

      /* دستورات نصب */
      for (var e = 0; e < caps.length; e++) {
        html += '<div class="instruction cap">🔵 <strong>' + caps[e].name + '</strong> (' + formatCap(caps[e].value) + ') — ' + T.series_with_spk + '</div>';
      }
      for (var f = 0; f < inds.length; f++) {
        html += '<div class="instruction ind">🟣 <strong>' + inds[f].name + '</strong> (' + formatInd(inds[f].value) + ') — ' + T.parallel_with_spk + '</div>';
      }
      html += '</div>';
      html += '<div class="summary-box">' + T.rule + '</div>';

    /* حالت پایین‌گذر: سلف سری — خازن موازی */
    } else {

      html += '<div class="schematic">';
      html += '<span class="sch-wire">──</span>';
      for (var g = 0; g < inds.length; g++) {
        html += '<span class="sch-ind">[' + inds[g].name + ']</span><span class="sch-wire">──</span>';
      }
      html += '<span class="sch-dot">●</span><span class="sch-wire">──</span>';
      html += '<span class="sch-spk">[ 🔊 ]</span>';
      html += '<span class="sch-wire">──</span><br>';
      html += '<span style="display:inline-block; width:100%; text-align:center; color:#fff;">│</span><br>';
      for (var h = 0; h < caps.length; h++) {
        html += '<span class="sch-cap">[' + caps[h].name + ']</span><br>';
      }
      html += '<span style="color:#fff;">│</span><br>';
      html += '<span class="sch-wire">──</span>';
      html += '</div>';

      /* دستورات نصب */
      for (var m = 0; m < inds.length; m++) {
        html += '<div class="instruction ind">🟣 <strong>' + inds[m].name + '</strong> (' + formatInd(inds[m].value) + ') — ' + T.series_with_spk + '</div>';

      for (var n = 0; n < caps.length; n++) {
        html += '<div class="instruction cap">🔵 <strong>' + caps[n].name + '</strong> (' + formatCap(caps[n].value) + ') — ' + T.parallel_with_spk + '</div>';

      html += '</div>';
      html += '<div class="summary-box">' + T.rule_lp + '</div>';
    }

    html += '</div>';

  /* ═══ حالت معکوس: خازن ← فرکانس ═══ */
  } else {
    var capVal = parseFloat(document.getElementById('cap_input').value);
    if (!capVal || capVal <= 0) {
      document.getElementById('output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
      return;
    }

    var capFarad = capVal * UNIT_TO_FARAD[unit];
    var coefs2 = getCoefficients(order);

    /* نمایش فرکانس قطع */
    html += '<div class="slope-box">';
    html += '<div class="slope-lbl">' + T.freq_result + '</div>';
    html += '<div class="slope-val">' + formatFreq(coefs2.caps[0].coef / (2 * Math.PI * capFarad * R)) + '</div>';

    html += '</div>';

    html += '<div class="section-title">' + T.freq_result + '</div>';
    for (var q = 0; q < coefs2.caps.length; q++) {

  }

  html += '</div>';
  document.getElementById('output').innerHTML = html;

/* ═══════════════════════════════════════════
   محاسبه سیم‌پیچی سلف
   فرمول Wheeler برای سلف هوایی
   ═══════════════════════════════════════════ */
function calcCoil() {
  var T = TRANSLATIONS[currentLang];
  var coreD_mm = parseFloat(document.getElementById('core_d').value);
  var target_mh = parseFloat(document.getElementById('target_mh').value);
  var wireD_mm = parseFloat(document.getElementById('wire_d').value);

  /* بررسی اعتبار مقادیر */
  if (isNaN(coreD_mm) || isNaN(target_mh) || isNaN(wireD_mm) || coreD_mm <= 0 || target_mh <= 0 || wireD_mm <= 0) {
    document.getElementById('coil_output').innerHTML = '<div class="result-box" style="border-color:#ff4466;"><p style="color:#ff4466;">' + T.error + '</p></div>';
    return;
  }

  /* تبدیل واحدها به سانتی‌متر */
  var r_cm = (coreD_mm / 2) / 10;
  var D_cm = coreD_mm / 10;
  var L_uH = target_mh * 1000;
  var wireD_cm = wireD_mm / 10;

  /* حل تکراری فرمول Wheeler برای یافتن تعداد دور */
  var N = Math.sqrt(L_uH / r_cm);
  for (var i = 0; i < 100; i++) {
    var l = N * wireD_cm;
    var newN = Math.sqrt(L_uH * (9 * r_cm + 10 * l) / (r_cm * r_cm));
    if (Math.abs(newN - N) < 0.001) { N = newN; break; }
    N = newN;
  }

  N = Math.ceil(N);
  var coilLength_cm = N * wireD_cm;
  var wireLength_m = (N * Math.PI * D_cm) / 100;

  /* نمایش نتایج */
  var html = '<div class="coil-result">';
  html += '<div class="coil-title">' + T.coil_title + '</div>';

  html += '<div class="item">';
  html += '<div class="item-row"><span class="item-name">' + T.turns + '</span>';
  html += '<span class="item-val" style="color:#ff6496;">' + N + ' ' + T.turn + '</span></div>';
  html += '</div>';

  html += '<div class="item">';
  html += '<div class="item-row"><span class="item-name">' + T.wire_len + '</span>';
  html += '<span class="item-val" style="color:#ff6496;">' + wireLength_m.toFixed(3) + ' ' + T.meter + '</span></div>';
  html += '</div>';

  html += '<div class="item">';
  html += '<div class="item-row"><span class="item-name">' + T.coil_len + '</span>';
  html += '<span class="item-val" style="color:#ff6496;">' + coilLength_cm.toFixed(3) + ' cm</span></div>';
  html += '</div>';

  html += '</div>';
  document.getElementById('coil_output').innerHTML = html;
  document.getElementById('coil_output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
